<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sửa lời thoại · Manga Translator Ultimate</title><link rel="stylesheet" href="app.css"><script src="editor.js" defer></script></head>
<body class="full editor"><header class="masthead"><div><span class="eyebrow">MANGA TRANSLATOR ULTIMATE</span><h1>Sửa lời thoại</h1></div></header>
<main class="editor-layout">
<div id="stage" aria-label="Ảnh truyện và các vùng thoại"></div>
<section>
<label>Vùng thoại<select id="region"></select></label><p id="source"></p><p id="issue" class="message" role="status"></p>
<form id="edit">
<label>Lời tiếng Việt<textarea id="text" maxlength="500" rows="4"></textarea></label>
<div class="form-grid">
<label>Trái (%)<input id="x" type="number" min="0" max="99" step="0.01" required></label>
<label>Trên (%)<input id="y" type="number" min="0" max="99" step="0.01" required></label>
<label>Rộng (%)<input id="w" type="number" min="0.2" max="100" step="0.01" required></label>
<label>Cao (%)<input id="h" type="number" min="0.2" max="100" step="0.01" required></label>
<label>Kiểu chữ<select id="font"><option value="">Theo hồ sơ</option><option value="regular">Thường</option><option value="bold">Đậm</option><option value="italic">Nghiêng</option></select></label>
<label>Cỡ chữ<input id="scale" type="number" min="0.7" max="1.5" step="0.05" placeholder="Theo hồ sơ"></label>
</div>
<p>Kéo khung đã chọn để đổi vị trí. Dùng các trường tỉ lệ để chỉnh kích thước. Để trống lời Việt để giữ vùng gốc.</p>
<div class="actions"><button class="primary" id="save">Lưu chỉnh sửa</button><button type="button" id="reset">Khôi phục vùng</button></div>
</form><p id="notice" class="message" role="status"></p>
</section></main></body></html>

name: Student Access Java
on:
  push:
    paths: ['student-access/**', '.github/workflows/student-access.yml']
  pull_request:
    paths: ['student-access/**', '.github/workflows/student-access.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: student-access
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: student-access/pom.xml
      - run: mvn --batch-mode clean package
      - uses: actions/upload-artifact@v4
        with:
          name: student-access-${{ matrix.os }}
          path: student-access/target/student-access-1.0.0.jar
